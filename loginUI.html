<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f5f5;
}

.container{
    width:350px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    text-align:center;
}

img{
    width:120px;
    border-radius:50%;
    margin-bottom:20px;
}

input[type=text],
input[type=password]{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

.login{
    background:#04AA6D;
    color:white;
}

.cancel{
    background:red;
    color:white;
}

.footer{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar">

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button class="login">Login</button>

<br><br>

<label>
<input type="checkbox">
Remember Me
</label>

<br><br>

<button class="cancel">Cancel</button>

<div class="footer">
<a href="#">Forgot Password?</a>
</div>

</div>

</body>
</html>
